<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Hour — a lantern-lit heist</title>
<style>
  html, body { margin: 0; padding: 0; background: #07080f; color: #f4f8ff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { width: 1280px; margin: 0 auto; }
  #hud { display: flex; align-items: center; gap: 14px; padding: 10px 16px 8px; }
  #hud .brand { font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #ffd93b; white-space: nowrap; }
  #hud .brand span { display: block; font-size: 10px; font-weight: 600; letter-spacing: 3px; color: #9db2cc; }
  #hud-level { font-size: 14px; color: #9db2cc; white-space: nowrap; }
  #hud-objective { font-size: 14px; color: #7df3ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  #hud-alarm { flex: 1; height: 26px; background: #12283d; border: 1px solid #233246;
    border-radius: 8px; position: relative; overflow: hidden; min-width: 140px; }
  #hud-alarm-fill { height: 100%; background: #2fd47a; width: 0%; transition: width 0.15s linear; }
  #hud-alarm-fill.warm { background: #ffb020; }
  #hud-alarm-fill.hot { background: #ff4b3e; }
  #hud-alarm-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; letter-spacing: 2px; }
  #hud-score { font-size: 17px; font-weight: 700; white-space: nowrap; }
  #hud-pebbles { font-size: 14px; color: #c8d4e8; white-space: nowrap; }
  #hud-lives { font-size: 15px; color: #ff5d5d; white-space: nowrap; letter-spacing: 2px; }
  #hud-timer { font-size: 15px; font-weight: 700; color: #c8d4e8; white-space: nowrap; }
  #hud button { font: inherit; font-size: 13px; font-weight: 700; color: #0d1b2e; background: #ffd93b;
    border: none; border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  #hud button.ghost { background: #12283d; color: #f4f8ff; border: 1px solid #233246; }
  #game { display: block; width: 1152px; height: 648px; margin: 0 auto; touch-action: none; cursor: crosshair; }
  #hud-message { position: absolute; left: 50%; transform: translateX(-50%); bottom: 4px; padding: 4px 14px; font-size: 15px; color: #ffd93b; min-height: 20px; background: rgba(8, 10, 20, 0.72); border-radius: 8px; white-space: nowrap; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<header id="hud">
  <div class="brand">VELVET HOUR<span>A LANTERN-LIT HEIST</span></div>
  <div id="hud-level">Floor 1 of 3 · The Lantern Gallery</div>
  <div id="hud-objective">Lift the Moonstone, then reach the EXIT</div>
  <div id="hud-alarm"><div id="hud-alarm-fill"></div><span id="hud-alarm-text">HIDDEN</span></div>
  <div id="hud-score">SCORE 0</div>
  <div id="hud-pebbles">PEBBLES 5</div>
  <div id="hud-lives">♥♥♥</div>
  <div id="hud-timer">0:00</div>
  <button id="btn-mute" type="button" class="ghost">Sound on</button>
</header>
<main><canvas id="game" width="1152" height="648" aria-label="Velvet Hour: a top-down stealth game. Slip past the guards, lift the Moonstone, reach the green exit."></canvas></main>
<footer id="hud-message"></footer>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
